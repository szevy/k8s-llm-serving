apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-service
  labels:
    release: monitoring        # required: the stack only adopts ServiceMonitors with its Helm release label
spec:
  selector:
    matchLabels:
      app: llm-service         # matches the labels on the SERVICE OBJECT's metadata (not pod labels)
  endpoints:
    - port: http               # the Service's named port
      interval: 15s
      path: /metrics